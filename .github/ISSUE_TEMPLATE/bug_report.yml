name: Bug report
description: Something in Guild Ranks doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      placeholder: "1. Open /granks\n2. Click Settings\n3. ..."
  - type: textarea
    id: diag
    attributes:
      label: Output of /granks diag
      description: Type /granks diag in game and paste the lines here (a screenshot is fine too).
      render: text
    validations:
      required: true
  - type: textarea
    id: selftest
    attributes:
      label: Output of /granks selftest
      render: text
  - type: textarea
    id: error
    attributes:
      label: Lua error (if any)
      description: Install BugSack to capture errors, then paste the full text.
      render: text
  - type: input
    id: version
    attributes:
      label: Guild Ranks version
      placeholder: "1.1.0"
