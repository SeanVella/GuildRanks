name: Release

# Push a tag like v1.0.0 to package the addon and publish it to GitHub Releases,
# plus CurseForge and Wago once their project IDs are in GuildRanks.toc and the
# API tokens are added as repository secrets (see README "Publishing").
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for the changelog

      - name: Run tests before publishing
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.1
          lua5.1 tests/run_all.lua
          python3 tests/parity_test.py

      # Tags containing "beta" or "alpha" (e.g. v1.1.0-beta.1) are published as
      # beta/alpha files, so only testers who opt in get them.
      - name: Package and publish
        uses: BigWigsMods/packager@v2
