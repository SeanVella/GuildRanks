name: Guild Ranks daily Discord post

on:
  schedule:
    # 07:00 and 08:00 UTC every day, so one run lands at 09:00 Malta time in both
    # summer and winter. The script posts only once per day, at or after DAILY_TIME.
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
    # Catch-up in case GitHub skipped or delayed the morning runs
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Post now, even if today's post was already done"
        type: boolean
        default: false
      dry_run:
        description: "Only show the message in the log (don't post)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: guild-ranks-state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post yesterday's results
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DAILY_TIME: ${{ vars.DAILY_TIME || '09:00' }}
          DAILY_SECTIONS: ${{ vars.DAILY_SECTIONS || 'player' }}
          DAILY_MIN_PLAYERS: ${{ vars.DAILY_MIN_PLAYERS || '2' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Europe/Malta' }}
          GUILD: ${{ vars.GUILD }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          [ "$FORCE" = "true" ] && args+=(--force)
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          python bot/guild_ranks_bot.py daily --uploads uploads --state state/daily-post.json "${args[@]}"

      - name: Save posting state
        run: |
          if [ -z "$(git status --porcelain state)" ]; then exit 0; fi
          git config user.name "guild-ranks-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git commit -m "Daily post state"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
